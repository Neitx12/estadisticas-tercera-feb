function posesiones(e) {
  return e.dosPA + e.tresPA + 0.44 * e.tlA - e.orb + e.to;
}

function posesionesRival(e) {
  return e.dosPAR + e.tresPAR + 0.44 * e.tlAR - e.orbR + e.toR;
}

function avanzadas(e) {

  const poss = posesiones(e);
  const possR = posesionesRival(e);

  const fga = e.dosPA + e.tresPA;
  const fgaR = e.dosPAR + e.tresPAR;

  return {
    posesiones: poss,
    ritmo: poss,
    efOf: e.pts / poss * 100,
    efDef: e.ptsR / possR * 100,
    efNeta: e.pts / poss * 100 - e.ptsR / possR * 100,

    rebDef:
      e.drb / (e.drb + e.orbR),

    rebOf:
      e.orb / (e.orb + e.drbR),

    rebTotal:
      e.trb / (e.trb + e.trbR),

    asPerd:
      e.ast / e.to,

    asistencias:
      e.ast / (e.dosPM + e.tresPM),

    tapones:
      e.blk / e.dosPAR,

    ts:
      e.pts / (2 * (fga + 0.44 * e.tlA)),

    efg:
      (e.dosPM + e.tresPM + 0.5 * e.tresPM) / fga,

    tov:
      e.to / poss,

    tresPA:
      e.tresPA / fga,

    ftr:
      e.tlA / fga,

    puntosTiro:
      e.pts / fga,

    efTiroRival:
      e.ptsR / fgaR
  };
}

function mediaEquipos() {

  const media = {};

  const numeric = [
    "pts","dosPM","dosPA","tresPM","tresPA","tlM","tlA",
    "orb","drb","trb","ast","stl","to","blk",
    "pf","pfr","val","masmenos",
    "ptsR","dosPMR","dosPAR","tresPMR","tresPAR",
    "tlMR","tlAR","orbR","drbR","trbR",
    "astR","stlR","toR","blkR","pfR","pfrR","valR"
  ];

  numeric.forEach(campo => {
    media[campo] =
      equipos.reduce((total,e) => total + e[campo],0) /
      equipos.length;
  });

  const av = equipos.map(avanzadas);

  Object.keys(av[0]).forEach(campo => {
    media[campo] =
      av.reduce((total,e) => total + e[campo],0) /
      av.length;
  });

  return media;
}

function formatoNumero(valor) {
  return Number(valor).toFixed(2);
}

function porcentaje(valor) {
  return (valor * 100).toFixed(2) + "%";
}

function crearTablaBase() {

  const columnas = [
    ["Equipo","nombre"],
    ["PTS","pts"],
    ["2P M","dosPM"],
    ["2P A","dosPA"],
    ["2P %",e => e.dosPM/e.dosPA],
    ["3P M","tresPM"],
    ["3P A","tresPA"],
    ["3P %",e => e.tresPM/e.tresPA],
    ["TL M","tlM"],
    ["TL A","tlA"],
    ["TL %",e => e.tlM/e.tlA],
    ["REB O","orb"],
    ["REB D","drb"],
    ["REB T","trb"],
    ["AST","ast"],
    ["REC","stl"],
    ["PÉRD","to"],
    ["TAP","blk"],
    ["TAP REC","blkRec"],
    ["FALTAS","pf"],
    ["F REC","pfr"],
    ["VAL","val"],
    ["+/-","masmenos"]
  ];

  let html = "<thead><tr>";

  columnas.forEach(c => {
    html += `<th>${c[0]}</th>`;
  });

  html += "</tr></thead><tbody>";

  equipos.forEach(e => {

    html += "<tr>";

    columnas.forEach(c => {

      let valor =
        typeof c[1] === "function"
          ? c[1](e)
          : e[c[1]];

      if (["2P %","3P %","TL %"].includes(c[0])) {
        valor = porcentaje(valor);
      } else if (c[0] === "+/-") {
        valor = formatoNumero(valor);

      } else if (typeof valor === "number") {
        valor = formatoNumero(valor);
      }

      html += `<td>${valor ?? 0}</td>`;
    });

    html += "</tr>";
  });

  const m = mediaEquipos();

  html += `<tr class="media">`;

  columnas.forEach(c => {

    if (c[0] === "Equipo") {
      html += "<td>MEDIA LIGA</td>";
      return;
    }

    let valor;

    if (typeof c[1] === "function") {

      if (c[0] === "2P %") valor = m.dosPM/m.dosPA;
      else if (c[0] === "3P %") valor = m.tresPM/m.tresPA;
      else if (c[0] === "TL %") valor = m.tlM/m.tlA;

    } else {
      valor = m[c[1]];
    }

    if (["2P %","3P %","TL %"].includes(c[0])) {
      html += `<td>${porcentaje(valor)}</td>`;
    } else {
      html += `<td>${formatoNumero(valor)}</td>`;
    }
  });

  html += "</tr></tbody>";

  document.getElementById("tablaBase").innerHTML = html;
}

        html += `<td>${e.nombre}</td>`;

      if (
        [
          "% Reb Def",
          "% Reb Of",
          "% Reb Total",
          "% Asistencias",
          "% Tapones",
          "TS%",
          "eFG%",
          "TOV%",
          "3PA%",
          "FTr"
        ].includes(c[0])
      ) {
        valor = porcentaje(valor);
      } else {
        valor = formatoNumero(valor);
      }

      let clase = "";

      if (c[0] === "EfNeta") {
        clase =
          valor >= 0
            ? "positive"
            : "negative";
      }

      html += `<td class="${clase}">${valor}</td>`;
    });

    html += "</tr>";
  });

  const av = mediaEquipos();

  html += `<tr class="media">`;

  columnas.forEach(c => {

    if (c[0] === "Equipo") {
      html += "<td>MEDIA LIGA</td>";
      return;
    }

    let valor = av[c[1]];

    if (
      [
        "% Reb Def",
        "% Reb Of",
        "% Reb Total",
        "% Asistencias",
        "% Tapones",
        "TS%",
        "eFG%",
        "TOV%",
        "3PA%",
        "FTr"
      ].includes(c[0])
    ) {
      valor = porcentaje(valor);
    } else {

    html += `<td>${valor}</td>`;

  html += "</tr></tbody>";

}

    ["EfOf",e => avanzadas(e).efOf],
    ["EfDef",e => avanzadas(e).efDef],
    ["EfNeta",e => avanzadas(e).efNeta],
    ["TS%",e => avanzadas(e).ts],
    ["eFG%",e => avanzadas(e).efg],
    ["TOV%",e => avanzadas(e).tov]
  ];

  let html = "<thead><tr>";

  columnas.forEach(c => {
    html += `<th>${c[0]}</th>`;
  });

  html += "</tr></thead><tbody>";

  equipos.forEach(e => {

    const a = avanzadas(e);

    html += "<tr>";

    columnas.forEach(c => {

      let valor;

      if (typeof c[1] === "function") {
        valor = c[1](e);
      } else {
        valor = e[c[1]];
      }

      if (
        ["2P %","3P %","TL %","TS%","eFG%","TOV%"].includes(c[0])
      ) {
        valor = porcentaje(valor);

      } else if (
        ["Ritmo","EfOf","EfDef","EfNeta"].includes(c[0])
      ) {
        valor = formatoNumero(valor);

      } else if (c[0] === "+/-") {
        valor = formatoNumero(valor);

      } else {
        valor = typeof valor === "number"
          ? formatoNumero(valor)
          : valor;
      }

      let clase = "";

      if (c[0] === "EfNeta") {
        clase =
          parseFloat(valor) >= 0
            ? "positive"
            : "negative";
      }

      html += `<td class="${clase}">${valor ?? 0}</td>`;
    });

    html += "</tr>";
  });

  const m = mediaEquipos();

  html += `<tr class="media">`;

  columnas.forEach(c => {

    if (c[0] === "Equipo") {
      html += "<td>MEDIA LIGA</td>";
      return;
    }

    let valor;

    switch(c[0]) {

      case "PTS": valor = m.pts; break;
      case "PTS Rival": valor = m.ptsR; break;
      case "2P %": valor = m.dosPM/m.dosPA; break;
      case "3P %": valor = m.tresPM/m.tresPA; break;
      case "TL %": valor = m.tlM/m.tlA; break;
      case "REB T": valor = m.trb; break;
      case "REB T Rival": valor = m.trbR; break;
      case "AST": valor = m.ast; break;
      case "PÉRD": valor = m.to; break;
      case "TAP": valor = m.blk; break;
      case "TAP REC": valor = m.blk; break;
      case "VAL": valor = m.val; break;
      case "+/-": valor = m.masmenos; break;
      case "Ritmo": valor = m.ritmo; break;
      case "EfOf": valor = m.efOf; break;
      case "EfDef": valor = m.efDef; break;
      case "EfNeta": valor = m.efNeta; break;
      case "TS%": valor = m.ts; break;
      case "eFG%": valor = m.efg; break;
      case "TOV%": valor = m.tov; break;
    }

    if (
      ["2P %","3P %","TL %","TS%","eFG%","TOV%"].includes(c[0])
    ) {
      valor = porcentaje(valor);
    } else {
      valor = formatoNumero(valor);
    }

    html += `<td>${valor}</td>`;
  });

  html += "</tr></tbody>";

  document.getElementById("tablaCompletos").innerHTML = html;
}

function mostrarTab(id, boton) {

  document.querySelectorAll(".tab").forEach(tab => {
    tab.classList.remove("active");
  });

  document.querySelectorAll(".tab-button").forEach(btn => {
    btn.classList.remove("active");
  });

  document.getElementById(id).classList.add("active");
  boton.classList.add("active");
}

crearTablaBase();
crearTablaAvanzada();
crearTablaCompleta();
