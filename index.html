function num(v){return Number.isFinite(Number(v))?Number(v):0}
function pct(m,a){return a?m/a:0}
function posesiones(e){return e.dosPA+e.tresPA+.44*e.tlA-e.orb+e.to}

function avanzadas(e){
  const poss=posesiones(e);
  const possR=e.dosPAR+e.tresPAR+.44*e.tlAR-e.orbR+e.toR;
  const fga=e.dosPA+e.tresPA;
  const fgaR=e.dosPAR+e.tresPAR;
  return {
    posesiones:poss, ritmo:poss,
    efOf:poss?e.pts/poss*100:0,
    efDef:possR?e.ptsR/possR*100:0,
    efNeta:(poss?e.pts/poss*100:0)-(possR?e.ptsR/possR*100:0),
    rebDef:(e.drb+e.orbR)?e.drb/(e.drb+e.orbR):0,
    rebOf:(e.orb+e.drbR)?e.orb/(e.orb+e.drbR):0,
    rebTotal:(e.trb+e.trbR)?e.trb/(e.trb+e.trbR):0,
    asPerd:e.to?e.ast/e.to:0,
    asistencias:(e.dosPM+e.tresPM)?e.ast/(e.dosPM+e.tresPM):0,
    tapones:e.dosPAR?e.blk/e.dosPAR:0,
    ts:(fga+.44*e.tlA)?e.pts/(2*(fga+.44*e.tlA)):0,
    efg:fga?(e.dosPM+e.tresPM+.5*e.tresPM)/fga:0,
    tov:poss?e.to/poss:0,
    tresPA:fga?e.tresPA/fga:0,
    ftr:fga?e.tlA/fga:0
  };
}

    id:e.id,nombre:e.nombre,escudo:escudos[e.nombre]||"",
    pts:0,ptsR:0,dosPM:0,dosPA:0,tresPM:0,tresPA:0,tlM:0,tlA:0,
    orb:0,drb:0,trb:0,ast:0,stl:0,to:0,blk:0,pf:0,pfr:0,val:0,masmenos:0,
    dosPAR:0,tresPAR:0,tlAR:0,orbR:0,drbR:0,trbR:0
  };
  stats.forEach(s=>{
    base.dosPM+=num(s.dosp_anotados); base.dosPA+=num(s.dosp_intentos);
    base.tresPM+=num(s.tresp_anotados); base.tresPA+=num(s.tresp_intentos);
    base.tlM+=num(s.tl_anotados); base.tlA+=num(s.tl_intentos);
    base.orb+=num(s.reb_ofensivos); base.drb+=num(s.reb_defensivos); base.trb+=num(s.reb_totales);
    base.ast+=num(s.asistencias); base.stl+=num(s.recuperaciones); base.to+=num(s.perdidas);
    base.blk+=num(s.tapones); base.pf+=num(s.faltas_cometidas); base.pfr+=num(s.faltas_recibidas);
    base.val+=num(s.valoracion);
  });
  const partidosEquipo=partidosDB.filter(p=>num(p.equipo_local_id)===num(e.id)||num(p.equipo_visitante_id)===num(e.id));
  const ids=new Set(partidosEquipo.map(p=>num(p.id)));
  partidosEquipo.forEach(p=>{
    const local=num(p.equipo_local_id)===num(e.id);
    base.pts+=local?num(p.puntos_local):num(p.puntos_visitante);
    base.ptsR+=local?num(p.puntos_visitante):num(p.puntos_local);
    base.masmenos+=local?(num(p.puntos_local)-num(p.puntos_visitante)):(num(p.puntos_visitante)-num(p.puntos_local));
    const rid=local?num(p.equipo_visitante_id):num(p.equipo_local_id);
    const rival=estadisticasDB.find(s=>num(s.partido_id)===num(p.id)&&num(s.equipo_id)===rid);
    if(rival){
      base.dosPAR+=num(rival.dosp_intentos); base.tresPAR+=num(rival.tresp_intentos); base.tlAR+=num(rival.tl_intentos);
      base.orbR+=num(rival.reb_ofensivos); base.drbR+=num(rival.reb_defensivos); base.trbR+=num(rival.reb_totales);
    }
  });
  Object.assign(base,avanzadas(base));
  return base;
}

function calcularEquipos(periodo){
  if(!equiposDB.length) return equiposFallback.map(e=>({...e,...avanzadas({...e,dosPAR:e.dosPAR||0,tresPAR:e.tresPAR||0,tlAR:e.tlAR||0,orbR:e.orbR||0,drbR:e.drbR||0,trbR:e.trbR||0})}));
  const maxJ=Math.max(0,...partidosDB.map(p=>num(p.jornada)));
  const minJ=periodo==="season"?1:Math.max(1,maxJ-num(periodo)+1);
  const ps=partidosDB.filter(p=>num(p.jornada)>=minJ);
  return equiposDB.map(e=>{
    const ids=new Set(ps.filter(p=>num(p.equipo_local_id)===num(e.id)||num(p.equipo_visitante_id)===num(e.id)).map(p=>num(p.id)));
    const st=estadisticasDB.filter(s=>num(s.equipo_id)===num(e.id)&&ids.has(num(s.partido_id)));
    return agregarEquipo(e,st);
  });
}

function textoDato(v,key){
  return mapaPorcentaje.has(key)?(num(v)*100).toFixed(1)+"%":num(v).toFixed(1);
}

function filtroCumple(valor,texto){
  if(!texto) return true;
  const t=texto.trim().toLowerCase();
  if(typeof valor==="string") return valor.toLowerCase().includes(t);
  const x=num(valor);
  let m;
  if((m=t.match(/^>\s*(-?\d+(?:\.\d+)?)$/))) return x>Number(m[1]);
  if((m=t.match(/^<\s*(-?\d+(?:\.\d+)?)$/))) return x<Number(m[1]);
  if((m=t.match(/^(-?\d+(?:\.\d+)?)\s*-\s*(-?\d+(?:\.\d+)?)$/))) return x>=Number(m[1])&&x<=Number(m[2]);
  const exact=Number(t);
  return Number.isFinite(exact)&&Math.abs(x-exact)<.0001;
}

function claseColor(valor,media,key){
  if(!Number.isFinite(valor)||!Number.isFinite(media)||media===0) return "neutro";
  const delta=(menorEsMejor.has(key)?(media-valor):(valor-media))/Math.abs(media);
  if(Math.abs(delta)<.05) return "neutro";
  if(delta>=.15) return "verde-fuerte";
  if(delta>0) return "verde-suave";
  if(delta<=-.15) return "rojo-fuerte";
  return "rojo-suave";
}

function construirTabla(rows,seasonRows,columnas,targetId){
  const media=mediaFilas(seasonRows);
  let sortKey=null,sortDir=-1, filtros={};

  const pintar=()=>{
    let visibles=rows.filter(r=>Object.entries(filtros).every(([k,v])=>filtroCumple(r[k]??"",v)));
    if(sortKey) visibles.sort((a,b)=>(typeof a[sortKey]==="string"?String(a[sortKey]).localeCompare(String(b[sortKey])):(num(a[sortKey])-num(b[sortKey])))*sortDir);

    let html="<table><thead><tr><th class='equipo'><div class='cab'>Equipo</div></th>";
    columnas.forEach(([label,key])=>html+=`<th><div class='cab'>${label}<button class='sort-btn' data-sort='${key}'>↕</button></div></th>`);
    html+="</tr><tr class='filtro-row'><th class='equipo'><input class='filtro' data-key='nombre' placeholder='Filtrar'></th>";
    columnas.forEach(([label,key])=>html+=`<th><input class='filtro' data-key='${key}' placeholder='Filtrar'></th>`);
    html+="</tr></thead><tbody>";

    visibles.forEach(r=>{
      html+="<tr>";
      html+=`<td class='equipo'><button class='equipo-btn' onclick='abrirModal(${num(r.id)})'>${r.escudo?`<img class='escudo' src='${r.escudo}' alt='' onerror="this.style.display='none'">`:""}<span>${r.nombre}</span></button></td>`;
      columnas.forEach(([label,key])=>html+=`<td class='${claseColor(num(r[key]),num(media[key]),key)}'>${textoDato(r[key],key)}</td>`);
      html+="</tr>";
    });

    html+="<tr class='media'><td class='equipo'>MEDIA LIGA · TEMPORADA</td>";
    columnas.forEach(([label,key])=>html+=`<td>${textoDato(media[key],key)}</td>`);
    html+="</tr></tbody></table>";

    document.getElementById(targetId).innerHTML=html;

    document.querySelectorAll(`#${targetId} .sort-btn`).forEach(b=>b.onclick=()=>{
      const k=b.dataset.sort;
      if(sortKey===k) sortDir*=-1; else {sortKey=k;sortDir=-1;}
      pintar();
    });

    document.querySelectorAll(`#${targetId} .filtro`).forEach(i=>{
      i.value=filtros[i.dataset.key]||"";
      i.oninput=()=>{filtros[i.dataset.key]=i.value;pintar();}
    });
  };
  pintar();
}

function mediaFilas(rows){
  const out={};
  const keys=[...new Set([...columnasBase,...columnasAvanzadas,...columnasCompletas].map(x=>x[1]))];
  keys.forEach(k=>out[k]=rows.length?rows.reduce((s,r)=>s+num(r[k]),0)/rows.length:0);
  return out;
}

function render(){
  const rows=calcularEquipos(periodoSeleccionado);
  const seasonRows=calcularEquipos("season");
  const nombres={1:"Última jornada",5:"Últimas 5",10:"Últimas 10",15:"Últimas 15",season:"Temporada"};

  document.getElementById("periodoTexto").textContent=nombres[periodoSeleccionado];
  document.getElementById("totalEquipos").textContent=rows.length;
  document.getElementById("ultimaJornada").textContent=Math.max(0,...partidosDB.map(p=>num(p.jornada)))||1;

  construirTabla(rows,seasonRows,columnasCompletas,"tablaCompletosWrap");
  construirTabla(rows,seasonRows,columnasBase,"tablaBaseWrap");
  construirTabla(rows,seasonRows,columnasAvanzadas,"tablaAvanzadaWrap");
}

async function cargarDatos(){
  const [e,p,s]=await Promise.all([
    supabaseClient.from("equipos").select("*").order("nombre"),
    supabaseClient.from("partidos").select("*").order("jornada"),
    supabaseClient.from("estadisticas_partido").select("*")
  ]);
  if(e.error||p.error||s.error) throw(e.error||p.error||s.error);
  equiposDB=e.data||[]; partidosDB=p.data||[]; estadisticasDB=s.data||[];

  // Las tablas de jugadores son opcionales en esta fase: si RLS las bloquea,
  // las tablas de equipos siguen funcionando.
  const [j,sj]=await Promise.all([
    supabaseClient.from("jugadores").select("*"),
    supabaseClient.from("estadisticas_jugador").select("*")
  ]);
  jugadoresDB=j.data||[];
  estadisticasJugadoresDB=sj.data||[];

  render();
}

function renderRanking(items,key,decimales=1){
  if(!items.length) return '<div class="mensaje">Todavía no hay datos de jugadores disponibles.</div>';
  return items.map((x,i)=>`<div class="fila"><span>${i+1}. ${x.nombre}</span><strong>${num(x.valor).toFixed(decimales)}</strong></div>`).join("");
}

function jugadoresDeEquipo(equipoId){
  const validos=partidosDB.filter(p=>num(p.equipo_local_id)===num(equipoId)||num(p.equipo_visitante_id)===num(equipoId));
  const ids=new Set(validos.map(p=>num(p.id)));

  const mapa=new Map();
  estadisticasJugadoresDB.filter(s=>ids.has(num(s.partido_id))).forEach(s=>{
    const j=jugadoresDB.find(x=>num(x.id)===num(s.jugador_id));
    if(!j) return;
    const key=num(j.id);
    if(!mapa.has(key)) mapa.set(key,{nombre:j.nombre,partidos:0,puntos:0,reb:0,val:0});
    const x=mapa.get(key);
    x.partidos++;
    x.puntos+=num(s.puntos);
    x.reb+=num(s.reb_totales);
    x.val+=num(s.valoracion);
  });
  return [...mapa.values()].map(x=>({
    nombre:x.nombre,
    puntos:x.puntos/(x.partidos||1),
    reb:x.reb/(x.partidos||1),
    val:x.val/(x.partidos||1)
  }));
}


function colorCabeceraEquipo(nombre){
  // Fallback general de la web.
  const fallback = { c1:"#00a6a6", c2:"#f0007f" };
  const imagen = escudos[nombre];
  if(!imagen) return fallback;

  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      try{
        const canvas = document.createElement("canvas");
        const size = 36;
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext("2d", {willReadFrequently:true});
        ctx.drawImage(img,0,0,size,size);
        const data = ctx.getImageData(0,0,size,size).data;

        const buckets = {};
        for(let i=0;i<data.length;i+=4){
          const r=data[i], g=data[i+1], b=data[i+2], a=data[i+3];
          if(a < 80) continue;

          // Ignore near-white / near-black pixels from logo backgrounds and outlines.
          const max=Math.max(r,g,b), min=Math.min(r,g,b);
          if(max > 245 && min > 235) continue;
          if(max < 24 && min < 24) continue;

          const key = [Math.round(r/20)*20, Math.round(g/20)*20, Math.round(b/20)*20].join(",");
          buckets[key]=(buckets[key]||0)+1;
        }

        const top = Object.entries(buckets)
          .sort((a,b)=>b[1]-a[1])
          .slice(0,2)
          .map(x=>x[0].split(",").map(Number));

        const toHex = arr => "#" + arr.map(v=>Math.max(0,Math.min(255,v)).toString(16).padStart(2,"0")).join("");
        if(top.length===1) resolve({c1:toHex(top[0]), c2:fallback.c2});
        else if(top.length>=2) resolve({c1:toHex(top[0]), c2:toHex(top[1])});
        else resolve(fallback);
      }catch(_){
        resolve(fallback);
      }
    };
    img.onerror = () => resolve(fallback);
    img.src = imagen;
  });
}

async function abrirModal(equipoId){
  const e=equiposDB.find(x=>num(x.id)===num(equipoId))||equiposFallback.find(x=>num(x.id)===num(equipoId));
  if(!e) return;
  const jugadores=jugadoresDeEquipo(equipoId);
  document.getElementById("modalNombre").textContent=e.nombre;
  document.getElementById("modalSubtitulo").textContent="Medias por partido · periodo seleccionado";
  document.getElementById("modalEscudo").src=escudos[e.nombre]||"";

  const colores = await colorCabeceraEquipo(e.nombre);
  const modalHead = document.querySelector(".modal-head");
  modalHead.style.setProperty("--team-color-1", colores.c1);
  modalHead.style.setProperty("--team-color-2", colores.c2);
  document.getElementById("rankingPuntos").innerHTML=renderRanking([...jugadores].sort((a,b)=>b.puntos-a.puntos).slice(0,3),"puntos");
  document.getElementById("rankingRebotes").innerHTML=renderRanking([...jugadores].sort((a,b)=>b.reb-a.reb).slice(0,3),"reb");
  document.getElementById("rankingValoracion").innerHTML=renderRanking([...jugadores].sort((a,b)=>b.val-a.val).slice(0,3),"val");
  document.getElementById("modalEquipo").classList.add("abierto");
}

function cerrarModal(){document.getElementById("modalEquipo").classList.remove("abierto")}

document.querySelectorAll(".periodo").forEach(b=>b.addEventListener("click",()=>{
  document.querySelectorAll(".periodo").forEach(x=>x.classList.remove("activo"));
  b.classList.add("activo");
  periodoSeleccionado=b.dataset.periodo==="season"?"season":Number(b.dataset.periodo);
  render();
}));

document.querySelectorAll(".tab-button").forEach(b=>b.addEventListener("click",()=>{
  document.querySelectorAll(".tab-button").forEach(x=>x.classList.remove("activo"));
  document.querySelectorAll(".contenido-tab").forEach(x=>x.classList.add("oculto"));
  b.classList.add("activo");
  document.getElementById(b.dataset.tab).classList.remove("oculto");
}));

document.getElementById("modalEquipo").addEventListener("click",e=>{if(e.target.id==="modalEquipo")cerrarModal()});

cargarDatos().catch(err=>{
  console.error(err);
  equiposDB=[];
  partidosDB=[];
  estadisticasDB=[];
  equiposFallback.forEach((e,i)=>e.id=i+1);
  render();
  document.getElementById("tablaCompletosWrap").insertAdjacentHTML("beforebegin",
    '<div class="mensaje">Mostrando los datos actuales de la web. La conexión con Supabase no ha podido completarse todavía.</div>');
});
</script>
